[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-spec-cli"
dynamic = ["version"]
description = "Run a django-service-specs registry from manage.py: one subcommand per spec, options generated from its parameters, exit codes for every refusal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
keywords = ["django", "management-command", "cli", "services", "specs", "dispatch"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Django is the base, and the floor is the kernel's: a command serves the
    # kernel's specs, so this package cannot support a Django the kernel does
    # not.
    "django>=4.2",
    # The first kernel release without its own copy of the command. A separate
    # distribution reads only the kernel's root surface, and below 0.11.0 the
    # kernel still ships ``commands/``, registers its own ``W001`` and ``W003``
    # and re-exports every moved name, so a project listing both apps sees two
    # sets of ids and a missed import rewrite resolves against the wrong code.
    # ``relax_partial``, ``refusal_messages`` and ``unguarded_specs`` are at its
    # root from 0.10.0.
    "django-service-specs>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/Artui/django-spec-cli"
Repository = "https://github.com/Artui/django-spec-cli"
Issues = "https://github.com/Artui/django-spec-cli/issues"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.32",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    # Backs the ``TID`` rule selection below; ruff reads its settings from the
    # flake8-tidy-imports namespace and the plugin is what defines them.
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=5.1.0",
    # ``render_result`` is tested against the kernel's pydantic presenter, the
    # real producer of a model-shaped result. pydantic is named as well, at the
    # extra's own floor, because the floor job lowers only direct dependencies:
    # through the extra alone it would resolve the newest pydantic.
    "django-service-specs[pydantic]",
    "pydantic>=2.11",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["django_spec_cli"]

[tool.hatch.version]
path = "django_spec_cli/version.py"
# Hatchling's default regex expects a bare ``__version__ = "..."``. This file
# annotates the assignment, so the pattern has to allow the annotation or the
# build cannot find the version at all.
pattern = "^__version__(?:\\s*:\\s*[A-Za-z][A-Za-z0-9_]*)?\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=django_spec_cli --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["django_spec_cli"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "TID"]
ignore = ["E203", "E501", "E231", "F811", "E722", "E741", "UP040", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# I002 exempts the two file kinds that must not carry the future import: a
# re-export ``__init__.py`` has no annotations to postpone, and migrations are
# generated by Django, so the import would be dropped on every makemigrations.
"__init__.py" = ["F401", "I002"]
"**/migrations/*.py" = ["I002"]

[tool.ruff.lint.isort]
known-first-party = ["django_spec_cli"]
# CLAUDE.md requires this at the top of every annotated file; required-imports
# is what enforces it rather than leaving it to memory.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# A TYPE_CHECKING guard exists to hide an import cycle from the interpreter
# while the type checker still sees it. Break the cycle instead: reorder the
# packages, put the shared base in ``types/``, or keep a recursive pair in one
# file (CLAUDE.md, rules 1, 8 and 9).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "Break the import cycle instead of guarding it."
"typing_extensions.TYPE_CHECKING".msg = "Break the import cycle instead of guarding it."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.environment]
root = ["./django_spec_cli"]

[tool.bumpversion]
current_version = "0.1.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "django_spec_cli/version.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/django-spec-cli/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/django-spec-cli/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/django-spec-cli/compare/v{current_version}...v{new_version}"""
